# Gera o APK do Android e publica nos Releases do GitHub.
#
# Para lançar uma versão: crie e envie uma tag "vX.Y.Z" (ex.: git tag v1.0.1 && git push origin v1.0.1)
# ou rode este workflow manualmente em Actions informando a versão.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   keystore de assinatura em base64
#   ANDROID_KEYSTORE_PASSWORD senha do keystore e da chave (alias "cobrei")
# Todas as versões precisam da MESMA chave, senão o Android não instala a atualização.
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 1.0.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão inválida: '$VERSION'. Use o formato 1.2.3."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verificar secrets de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Configure os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Testes e typecheck
        run: |
          npm test
          npm run typecheck

      # versionCode precisa sempre crescer para o Android aceitar a atualização.
      - name: Aplicar versão no app.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '

      - name: Gerar projeto nativo
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Assinar APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BUILD_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias cobrei \
            --ks-pass env:PASSWORD --key-pass env:PASSWORD \
            --out "Cobrei-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "Cobrei-$VERSION.apk"
          rm "$RUNNER_TEMP/release.keystore"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cobrei ${{ steps.version.outputs.version }}
          files: Cobrei-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          body: |
            ## Como instalar
            1. Baixe o arquivo **Cobrei-${{ steps.version.outputs.version }}.apk** abaixo, pelo celular.
            2. Abra o arquivo e permita "instalar apps desconhecidos" se o Android pedir.
            3. Se já tiver o Cobrei instalado, ele é atualizado e seus dados continuam salvos.
